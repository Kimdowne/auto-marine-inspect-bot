behaviors:
  HumanAvoidance:
    trainer_type: ppo
    hyperparameters:
      # Repeated decisions every 0.2 seconds of simulation time.
      batch_size: 128
      buffer_size: 1024
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    checkpoint_interval: 250000
    max_steps: 3000000
    time_horizon: 128
    # Aggregate a wider window so long-run learning trends are easier to read.
    summary_freq: 2000
    keep_checkpoints: 5
default_settings: null
engine_settings:
  time_scale: 10
